# Local/CI Supabase CLI configuration. The remote project reference is supplied
# securely through GitHub Actions and is intentionally not committed here.
project_id = "career-care-center"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://app.careercarecenter.com.ng"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "https://app.careercarecenter.com.ng/**",
  "https://careercarecenter.com.ng/**",
  "https://www.careercarecenter.com.ng/**",
  "https://career-care-center.vercel.app/**",
]
jwt_expiry = 3600
enable_signup = true

[auth.email.template.recovery]
subject = "Reset your Career Care Center password"
content_path = "./supabase/templates/recovery.html"

[storage]
enabled = true
file_size_limit = "50MiB"

# Privileged functions additionally validate the verified service_role claim.
[functions.admin-notify]
verify_jwt = true

[functions.welcome-email]
verify_jwt = true

[functions.send-contact-reply]
verify_jwt = true

[functions.send-session-invitations]
verify_jwt = true

# Resend authenticates this public endpoint with signed Svix headers.
[functions.resend-webhook]
verify_jwt = false
