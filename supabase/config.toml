# Local/CI Supabase CLI configuration. The remote project reference is supplied
# securely through GitHub Actions and is intentionally not committed here.
project_id = "career-care-center"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://www.careercarecenter.com.ng"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"

# Privileged functions additionally validate the verified service_role claim.
[functions.admin-notify]
verify_jwt = true

[functions.welcome-email]
verify_jwt = true
