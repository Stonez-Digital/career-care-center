name: Enhance Executive Committee Image

on:
  workflow_dispatch:
  push:
    paths:
      - "public/executive-committee-2026-27.jpg"

permissions:
  contents: write

jobs:
  enhance-image:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Enhance image
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter, ImageOps

          path = "public/executive-committee-2026-27.jpg"
          img = Image.open(path).convert("RGB")

          # The source is small and compressed, so enlarge it cleanly first,
          # then apply a restrained detail/sharpening pass without changing
          # faces, names, positions, or the composition.
          scale = 4
          enlarged = img.resize((img.width * scale, img.height * scale), Image.Resampling.LANCZOS)
          enhanced = ImageOps.autocontrast(enlarged, cutoff=0.4)
          enhanced = enhanced.filter(ImageFilter.UnsharpMask(radius=1.4, percent=145, threshold=3))
          enhanced.save(path, "JPEG", quality=97, subsampling=0, optimize=True)
          print(f"Enhanced {img.size} -> {enhanced.size}")
          PY

      - name: Commit enhanced image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/executive-committee-2026-27.jpg
          git diff --cached --quiet && exit 0
          git commit -m "fix: enhance executive committee image clarity"
          git push
