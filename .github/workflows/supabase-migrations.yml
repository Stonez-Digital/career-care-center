name: Supabase Migration Gate

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/templates/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migration-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: supabase/setup-cli@ad077b4817fff9ecc3c1fd20d271ec351e2d7244 # v1.7.0
        with:
          # 2.112.0 currently rejects one Management API key timestamp for
          # this project during `supabase link`. Keep CI on the verified CLI.
          version: 2.101.0

      - name: Validate protected configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured in the protected production environment."
              missing=1
            fi
          done
          exit "$missing"

      - name: Link database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Sync production auth redirects
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          payload="$(jq -n \
            '{
              site_url: "https://app.careercarecenter.com.ng",
              uri_allow_list: "http://localhost:5173/**,https://app.careercarecenter.com.ng/**,https://careercarecenter.com.ng/**,https://www.careercarecenter.com.ng/**,https://career-care-center.vercel.app/**"
            }')"
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth"

      - name: Compare migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase migration list

      - name: Migration dry run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --dry-run

      - name: Apply migrations after reconciliation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SUPABASE_MIGRATIONS_READY == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push

      - name: Deploy protected Edge Functions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SUPABASE_MIGRATIONS_READY == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase functions deploy admin-update-user-role
          supabase functions deploy contact-form
          supabase functions deploy process-donation
          supabase functions deploy submit-application
          supabase functions deploy send-contact-reply
          supabase functions deploy resend-webhook --no-verify-jwt
          supabase functions deploy send-session-invitations
          supabase functions deploy send-user-broadcast

      - name: Explain production interlock
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SUPABASE_MIGRATIONS_READY != 'true'
        shell: bash
        run: |
          echo "Migration validation completed without applying production changes." >> "$GITHUB_STEP_SUMMARY"
          echo "After migration history is reconciled, set the production environment variable SUPABASE_MIGRATIONS_READY=true." >> "$GITHUB_STEP_SUMMARY"
