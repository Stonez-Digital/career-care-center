name: Extract Executive Source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-executive-source.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build full-resolution SVG wrapper from original source
        shell: bash
        run: |
          python -m pip install pillow --quiet
          python - <<'PY'
          import base64, subprocess
          src = subprocess.check_output([
              "git", "show",
              "7a40b07018c49ec16510b95152d34d867e41d0f0:public/executive-committee-2026-27.jpg"
          ])
          b64 = base64.b64encode(src).decode()
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320"><image href="data:image/jpeg;base64,{b64}" width="320" height="320" preserveAspectRatio="none"/></svg>'''
          open("public/executive-committee-preview.svg","w",encoding="utf-8").write(svg)
          print("source bytes:", len(src), "svg chars:", len(svg))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/executive-committee-preview.svg
          git commit -m "chore: extract full executive committee source [skip ci]"
          git push
