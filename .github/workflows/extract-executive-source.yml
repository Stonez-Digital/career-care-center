name: Extract Executive Source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-executive-source.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build full-resolution SVG wrapper from original source
        shell: bash
        run: |
          python - <<'PY'
          import base64, subprocess
          src = subprocess.check_output([
              "git", "show",
              "699175e13e09c26eadb98b553f255c895d62808f:public/executive-committee-2026-27.jpg"
          ])
          b64 = base64.b64encode(src).decode()
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><image href="data:image/jpeg;base64,{b64}" width="640" height="640" preserveAspectRatio="none"/></svg>'''
          open("public/executive-committee-2026-27-full.svg","w",encoding="utf-8").write(svg)
          print("source bytes:", len(src), "svg chars:", len(svg))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/executive-committee-2026-27-full.svg
          git commit -m "chore: extract full executive committee source [skip ci]"
          git push
