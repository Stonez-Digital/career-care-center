name: Executive Preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/executive-preview.yml"

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create low-resolution preview
        run: |
          python -m pip install pillow --quiet
          python - <<'PY'
          import base64, subprocess, io
          from PIL import Image
          src = subprocess.check_output(["git","show","699175e13e09c26eadb98b553f255c895d62808f:public/executive-committee-2026-27.jpg"])
          im = Image.open(io.BytesIO(src)).convert("RGB")
          im.thumbnail((320,320))
          buf=io.BytesIO()
          im.save(buf, format="JPEG", quality=35, optimize=True)
          b64=base64.b64encode(buf.getvalue()).decode()
          svg=f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320"><image href="data:image/jpeg;base64,{b64}" width="320" height="320"/></svg>'
          open("public/executive-committee-preview.svg","w").write(svg)
          print("original",len(src),"preview",len(buf.getvalue()),"svg",len(svg))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/executive-committee-preview.svg
          git commit -m "chore: add executive source preview [skip ci]"
          git push
