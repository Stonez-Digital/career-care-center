name: Enhance Executive Portraits

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enhance-executive-portraits.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: executive-portrait-enhancement
  cancel-in-progress: false

jobs:
  enhance-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate enhanced portrait copies
        run: python scripts/enhance_executive_portraits.py

      - name: Install Node dependencies and run project checks
        run: |
          npm ci
          npm run check

      - name: Commit enhanced copies without changing originals
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/executives/enhanced/*.webp
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Enhanced portrait files are already up to date."
          else
            git commit -m "Enhance executive portrait image assets"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch the existing Cloudflare production deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/cloudflare-deploy.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Requested the existing Cloudflare production deployment workflow on main."
